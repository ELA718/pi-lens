id: no-sql-in-code-js
language: JavaScript
message: "SQL injection risk — parameterize dynamic query values"
severity: error
note: |
  Static SQL and placeholders with separately bound values are safe.
  This syntax rule reports non-literal expressions in argument 1. Production
  runners discard only expressions proven to be visible immutable constants;
  raw CLI output remains conservative when provenance is unavailable.
rule:
  all:
    - any:
        - pattern: $DB.query($SQL)
        - pattern: $DB.query($SQL, $$$REST)
constraints:
  SQL:
    not:
      any:
        - kind: string
        - kind: number
        - kind: arrow_function
        - kind: function_expression
        - kind: template_string
          not:
            has:
              kind: template_substitution
