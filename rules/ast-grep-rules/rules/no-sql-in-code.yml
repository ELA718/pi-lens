id: no-sql-in-code
language: TypeScript
message: "SQL injection risk — parameterize dynamic query values"
severity: error
note: |
  Static SQL and placeholders with separately bound values are safe.
  This syntax rule reports SQL composed directly from member access,
  calls, indexing, or other dynamic expressions in argument 1. The
  tree-sitter SQL rule handles bare-identifier provenance and accepts
  only visible, unique, immutable constants.
rule:
  all:
    - any:
        - pattern: $DB.query($SQL)
        - pattern: $DB.query($SQL, $$$REST)
constraints:
  SQL:
    all:
      - any:
          - kind: identifier
          - kind: call_expression
          - kind: member_expression
          - kind: subscript_expression
          - kind: binary_expression
          - kind: template_string
            has:
              kind: template_substitution
