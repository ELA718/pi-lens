id: no-sql-in-code
valid:
  - "db.find({ id })"
  - "db.findOne({ where: { id } })"
  - 'sql.unsafe("non-sql")'
  - 'db.query("SELECT * FROM users")'
  - 'db.query("INSERT INTO x VALUES (1)")'
  - 'db.query("UPDATE users SET x = 1")'
  - 'db.query("SELECT * FROM users WHERE id = $1", [id])'
  - 'db.query("status", ["SELECT * FROM audit_log"])'
  - 'db.query(() => "SELECT 1")'
invalid:

  - 'db.query(sql)'
  - 'db.query(`SELECT * FROM users WHERE id = ${request.params.id}`)'
  - 'db.query("SELECT * FROM users WHERE id = " + request.params.id)'
  - 'db.query((request.body.sql))'
  - 'db.query(flag ? request.body.sql : "SELECT 1")'
  - 'db.query(await getSql())'
  - 'db.query(request.body.sql as string)'
  - 'db.query(<string>request.body.sql)'
