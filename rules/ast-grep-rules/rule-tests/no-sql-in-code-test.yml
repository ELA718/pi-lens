id: no-sql-in-code
valid:
  - "db.find({ id })"
  - "db.findOne({ where: { id } })"
  - 'sql.unsafe("non-sql")'
  - 'db.query("SELECT * FROM users")'
  - 'db.query("INSERT INTO x VALUES (1)")'
  - 'db.query("UPDATE users SET x = 1")'
  - 'db.query("SELECT * FROM users WHERE id = $1", [id])'
  - 'db.query("status", ["SELECT * FROM audit_log"])'
invalid:

  - 'db.query(sql)'
  - 'db.query(`SELECT * FROM users WHERE id = ${request.params.id}`)'
  - 'db.query("SELECT * FROM users WHERE id = " + request.params.id)'
